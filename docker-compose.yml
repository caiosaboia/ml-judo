services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml_judo_app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - ./plots:/app/plots
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml_judo_pipeline
    volumes:
      - ./data:/app/data:ro
      - ./plots:/app/plots
    entrypoint: ["python", "main.py"]
    profiles:
      - pipeline

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml_judo_test
    entrypoint: ["pytest"]
    profiles:
      - test
